user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    # 开启gzip压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/x-javascript application/xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";
    
    # 超时设置
    keepalive_timeout 65;
    client_max_body_size 100m;
    
    # Spring Boot后端服务配置
    upstream springboot_backend {
        # 使用轮询策略
        server 192.168.1.101:8080;  # 节点1
        server 192.168.1.102:8080;  # 节点2
        server 192.168.1.103:8080;  # 节点3
    }
    
    # FastAPI服务配置
    upstream fastapi_backend {
        # 使用轮询策略
        server 192.168.1.101:8000;  # 节点1
        server 192.168.1.102:8000;  # 节点2
        server 192.168.1.103:8000;  # 节点3
    }
    
    # Spring Boot服务配置
    server {
        listen 80;
        server_name api.example.com;  # Spring Boot服务的域名
        
        location /api/ {
            proxy_pass http://springboot_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 错误处理
            proxy_intercept_errors on;
            error_page 500 502 503 504 /50x.html;
        }
        
        # 错误页面
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # FastAPI服务配置
    server {
        listen 80;
        server_name ai-api.example.com;  # FastAPI服务的域名
        
        location /api/ {
            proxy_pass http://fastapi_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 错误处理
            proxy_intercept_errors on;
            error_page 500 502 503 504 /50x.html;
        }
        
        # 错误页面
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
} 